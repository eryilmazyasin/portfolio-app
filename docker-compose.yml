# [ÖĞRENME NOTU]: Tüm servislerimizi tek bir komutla orkestre ettiğimiz ana yapılandırma.
services:
  # 1. Next.js Uygulaması
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/portfolio_db
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - portfolio_net # Servisleri aynı sanal ağa dahil ediyoruz.

  # 2. Nginx (Reverse Proxy)
  # [ÖĞRENME NOTU]: Dış dünyadan (80 portu) gelen istekleri karşılayıp 'app' servisine iletir.
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - portfolio_net

  # 3. PostgreSQL Veritabanı
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      # [ÖĞRENME NOTU]: Konteyner silinse bile veritabanı verilerimizin kaybolmaması için kalıcı Volume kullanıyoruz.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # [ÖĞRENME NOTU]: DB'nin tam olarak ayağa kalkıp kalkmadığını kontrol eder, 'app' servisi bunu bekler.
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_net

  # 4. Redis (Cache)
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - portfolio_net

networks:
  portfolio_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
