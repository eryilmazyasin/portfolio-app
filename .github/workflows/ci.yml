# .github/workflows/ci.yml
name: Portfolio CI Pipeline

# [ÖĞRENME NOTU]: Bu pipeline main dalına her push yapıldığında veya PR açıldığında otomatik çalışır.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Kodu sanal makineye (runner) kopyala
      - name: 🛎️ Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js ortamını kur ve cache avantajı sağla
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Paketleri kur (npm install yerine 'ci' daha güvenli ve hızlıdır)
      - name: 📦 Install Dependencies
        run: npm ci

      # 4. ESLint kurallarını denetle
      - name: 🔍 Run Linter
        run: npm run lint

      # 5. TypeScript tip hatalarını kontrol et (noEmit: kod üretmeden sadece hatalara bak)
      - name: 🛡️ Type Check
        run: npx tsc --noEmit

      # 6. Uygulamanın başarıyla derlendiğinden emin ol (Docker'a girmeden Next.js build)
      - name: 🏗️ Build Application
        run: npm run build
        env:
          # Build sırasında dummy URL'ler veriyoruz ki hata fırlatmasın
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portfolio_db
          REDIS_URL: redis://localhost:6379
